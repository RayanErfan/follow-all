<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><filter id="sh" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8c959f" flood-opacity="0.35"/></filter><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker></defs><rect width="900" height="520" fill="#eef1f4"/><rect x="20" y="16" width="860" height="488" rx="10" fill="#ffffff" stroke="#d0d7de" filter="url(#sh)"/><path d="M20,26 a10,10 0 0 1 10,-10 h840 a10,10 0 0 1 10,10 v28 h-860 z" fill="#f6f8fa"/><line x1="20" y1="54" x2="880" y2="54" stroke="#d0d7de"/><circle cx="42" cy="35" r="6" fill="#ff7b72"/><circle cx="62" cy="35" r="6" fill="#ffd666"/><circle cx="82" cy="35" r="6" fill="#7ee787"/><rect x="100" y="24" width="760" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/><text x="112" y="39" font-size="12" fill="#57606a">https://github.com/settings/tokens/new</text><text x="44" y="92" font-size="20" font-weight="700" fill="#24292f">New personal access token (classic)</text><text x="44" y="126" font-size="14" font-weight="600" fill="#24292f">Note</text><rect x="44" y="136" width="380" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="157" font-size="13" fill="#24292f">college-assignment</text><text x="44" y="194" font-size="14" font-weight="600" fill="#24292f">Expiration</text><rect x="44" y="204" width="240" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="225" font-size="13" fill="#24292f">7 days  &#9662;</text><text x="44" y="270" font-size="14" font-weight="700" fill="#24292f">Scopes</text><text x="44" y="292" font-size="13" fill="#57606a">Select which permissions to grant &#8212; leave everything unchecked except user:follow.</text><rect x="58" y="314" width="16" height="16" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="88" y="328" font-size="14" fill="#24292f">repo</text><text x="142" y="328" font-size="13" fill="#57606a">Full control of private repositories</text><rect x="58" y="348" width="16" height="16" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="88" y="362" font-size="14" fill="#24292f">workflow</text><text x="178" y="362" font-size="13" fill="#57606a">Update GitHub Action workflows</text><rect x="58" y="382" width="16" height="16" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="88" y="396" font-size="14" fill="#24292f">write:packages</text><text x="232" y="396" font-size="13" fill="#57606a">Upload packages to GitHub Package Registry</text><rect x="58" y="416" width="16" height="16" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="88" y="430" font-size="14" fill="#24292f">admin:org</text><text x="187" y="430" font-size="13" fill="#57606a">Full control of orgs and teams</text><rect x="44" y="444" width="812" height="32" rx="6" fill="#fff8c5"/><rect x="58" y="452" width="16" height="16" rx="4" fill="#1f883d"/><path d="M62,460 l3.5,4 l7,-8" stroke="#ffffff" stroke-width="2.2" fill="none"/><text x="88" y="466" font-size="14" font-weight="700" fill="#24292f">user:follow</text><text x="200" y="466" font-size="13" fill="#57606a">Follow and unfollow other users</text><rect x="40" y="440" width="700" height="40" rx="6" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="7,4"/><line x1="746" y1="460.0" x2="758" y2="460.0" stroke="#cf222e" stroke-width="2.5" marker-end="url(#ar)"/><text x="766" y="465.0" font-size="15" font-weight="700" fill="#cf222e">check ONLY this one</text><rect x="44" y="500" width="180" height="34" rx="6" fill="#1f883d"/><text x="134" y="522" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Generate token</text><rect x="40" y="496" width="188" height="42" rx="6" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="7,4"/><line x1="234" y1="517.0" x2="246" y2="517.0" stroke="#cf222e" stroke-width="2.5" marker-end="url(#ar)"/><text x="254" y="522.0" font-size="15" font-weight="700" fill="#cf222e">2. then click this</text></svg>
